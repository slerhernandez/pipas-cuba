<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipas Cuba</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#0b5ea8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f8;--card:#fff;--ink:#0d2233;--mut:#5b7183;--line:#d9e4ec;--pri:#0b5ea8;--pri2:#083a69;--aqua:#13a8c9;--ok:#1d8048;--warn:#b86e00;--bad:#c62e2e}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.3;padding-bottom:86px}
header{background:linear-gradient(135deg,var(--pri2),var(--pri) 60%,var(--aqua));color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.brand{font-weight:800;font-size:23px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.lbadge{background:#fff;border-radius:12px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}.lbadge svg{width:34px;height:34px}.brand{letter-spacing:1px}
.role{font-size:14px;opacity:.9;margin-top:2px}
.hbtns{display:flex;gap:6px}
.chip{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:6px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
main{padding:14px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(13,34,51,.06);border:1px solid var(--line)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin:20px 4px 8px;font-weight:700}
h3{margin:0 0 6px;font-size:18px}
.big{font-size:38px;font-weight:800;letter-spacing:-.5px}
.mid{font-size:24px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font:inherit;font-weight:700;font-size:15px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.tile .e{font-size:26px}
.tile:active{background:#e6eef5}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:disabled{opacity:.5}
.btn.sec{background:#e3edf5;color:var(--pri2)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn.block{width:100%;display:block}
.btn.sm{padding:8px 12px;font-size:15px;border-radius:10px}
.btn.huge{font-size:21px;padding:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:#e3edf5;color:var(--pri2);vertical-align:middle}
.pill.warn{background:#fff0d1;color:#7d4b00}.pill.bad{background:#fde1e1;color:#9b1c1c}.pill.ok{background:#dcf2e5;color:#165f36}
.mut{color:var(--mut)}.small{font-size:14px}.xs{font-size:12.5px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.r{text-align:right}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12.5px;color:var(--mut);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav button.on{color:var(--pri);font-weight:800}
nav .ic{font-size:21px;line-height:1}
.badge{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 6px}
#sheet{display:none}
#sheet.on{display:block}
.ov{position:fixed;inset:0;background:rgba(8,26,40,.45);z-index:10}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));z-index:11;max-width:720px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:20px}
.x{border:0;background:#eef3f7;border-radius:99px;width:36px;height:36px;font-size:18px;cursor:pointer}
form label.l{display:block;font-size:14.5px;font-weight:700;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfe;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--aqua);border-color:transparent}
textarea{min-height:70px}
.seg{display:flex;gap:6px}
.seg label{flex:1;margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:11px 4px;border:1px solid var(--line);border-radius:10px;font-weight:700;font-size:15px}
.seg input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri)}
.hint{font-size:13.5px;color:var(--mut);margin-top:4px}
.banner{background:var(--bad);color:#fff;border-radius:14px;padding:14px;font-weight:700;margin-bottom:12px}
.banner.warn{background:#fff0d1;color:#6e4200;border:1px solid #f3d495}
.banner.info{background:#e3f3f8;color:#0a4d63;border:1px solid #b9e2ee;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
tr.alert td{background:#fdeeee}
.thumb{width:100%;max-height:280px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#f4f7f9;margin-top:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv.tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:8px;font-weight:800;font-size:19px}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wnav b{text-align:center;flex:1}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#0d2233;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center;font-weight:600}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:18px 6px}
.center{text-align:center}
.load{padding:60px 20px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header><div class="hrow">
  <div><div class="brand"><span class="lbadge"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><clipPath id="lt"><rect x="5" y="17" width="38" height="25" rx="10"/></clipPath></defs><path d="M52 4c-2.6 3.4-4.4 5.9-4.4 8.1a4.4 4.4 0 0 0 8.8 0C56.4 9.9 54.6 7.4 52 4Z" fill="#13A8C9"/><g clip-path="url(#lt)"><rect x="5" y="17" width="38" height="25" fill="#1F4F9E"/><rect x="5" y="22" width="38" height="5" fill="#fff"/><rect x="5" y="32" width="38" height="5" fill="#fff"/><path d="M5 17 24 29.5 5 42Z" fill="#D7262E"/><path d="m11.5 25.6 1.1 2.6 2.8.2-2.1 1.8.7 2.7-2.5-1.5-2.4 1.5.7-2.7-2.2-1.8 2.8-.2Z" fill="#fff"/></g><path d="M45 42V27a4 4 0 0 1 4-4h4.5a4 4 0 0 1 3.3 1.8l2.6 3.9a4 4 0 0 1 .6 2.1V42Z" fill="#12325E"/><path d="M49 27h4.6l2.6 4H49Z" fill="#CFE9F2"/><rect x="3" y="42" width="57" height="4.5" rx="2.2" fill="#12325E"/><circle cx="16" cy="49" r="6.5" fill="#12325E"/><circle cx="16" cy="49" r="2.4" fill="#fff"/><circle cx="50" cy="49" r="6.5" fill="#12325E"/><circle cx="50" cy="49" r="2.4" fill="#fff"/></svg></span>PIPAS CUBA</div>
  <div class="role" id="role">Cargando…</div></div>
  <div class="hbtns" id="hbtns"></div>
</div></header>
<main id="main"><div class="load">Cargando…</div></main>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(+n||0)).toLocaleString('es-MX');
const num=n=>(+n||0).toLocaleString('es-MX',{maximumFractionDigits:1});
const has=v=>v!==undefined&&v!==null&&v!=='';
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmtD(new Date());
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d)};
const satOf=s=>addDays(s,6-parseD(s).getDay());
const inWeek=(f,sat)=>!!f&&f>addDays(sat,-7)&&f<=sat;
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dLabel=s=>{const d=parseD(s);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]};
const hhmm=ts=>{if(!ts)return'';const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'lugar';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- estado ---------- */
const S={db:null,user:null,assets:null,isOwner:false,login:false,noconfig:false,norole:false,email:'',role:'',roles:[],installEvt:null,view:'admin',tab:null,
  movs:[],pedidos:[],jornadas:[],reps:[],cortes:[],lugares:[],config:{},
  loaded:false,slow:false,nodb:false,week:satOf(today()),memo:{},firstSat:null};
try{const v=localStorage.getItem('pc_view');if(v)S.view=v}catch(e){}

const T={
  venta:{n:'Venta',e:'💧'},
  sueldo:{n:'Sueldo del día',e:'👷'},
  diesel:{n:'Diésel',e:'⛽'},
  gasto:{n:'Gasto',e:'🧾'},
  extra:{n:'Horas extra',e:'⏱️'},
  prestamo:{n:'Préstamo',e:'🤝'},
  dep_admin:{n:'Depósito del admin al chofer',e:'🏦'},
  dep_chofer:{n:'Depósito del chofer al admin',e:'📤'},
  reparacion:{n:'Reparación',e:'🔧'}
};
const cfg=k=>{const d={sueldo:500,horaInicio:'08:00',umbralDedos:0.5,litrosPorDedo:'',nombreChofer:'Chofer'};return has(S.config[k])?S.config[k]:d[k]};
const isAdmin=()=>S.isOwner&&S.view==='admin';
const me=()=>isAdmin()?'admin':'chofer';

/* ---------- cálculos ---------- */
const activo=m=>!['anulado','rechazado','pendiente'].includes(m.estado);
const vigente=m=>!['anulado','rechazado'].includes(m.estado);
function cajaDelta(m){
  if(!activo(m))return 0;const v=+m.monto||0;
  switch(m.tipo){
    case'venta':return m.pago==='efectivo'?v:0;
    case'dep_admin':return v;
    case'prestamo':return m.origen==='caja'?-v:0;
    case'reparacion':return m.pagadoPor==='caja'?-v:0;
    default:return -v;
  }
}
const cajaFecha=m=>m.tipo==='venta'&&m.fechaCobro?m.fechaCobro:m.fecha;
function calcWeek(sat,prev){
  const fondoIni=prev?prev.fondoQueda:0,deudaAnt=prev?prev.deudaPasa:0;
  const caja=fondoIni+S.movs.filter(m=>inWeek(cajaFecha(m),sat)).reduce((a,m)=>a+cajaDelta(m),0);
  const prest=S.movs.filter(m=>m.tipo==='prestamo'&&activo(m)&&inWeek(m.fecha,sat)).reduce((a,m)=>a+(+m.monto||0),0);
  const deudaTotal=deudaAnt+prest;
  const c=S.cortes.find(x=>x.id===sat);const closed=!!(c&&c.cerrado);
  return{sat,fondoIni,deudaAnt,caja,prest,deudaTotal,closed,corte:c,
    fondoQueda:closed?(+c.fondoQueda||0):caja,deudaPasa:closed?(+c.deudaPasa||0):deudaTotal};
}
function weekState(sat){
  if(S.memo[sat])return S.memo[sat];
  let w=S.firstSat&&S.firstSat<sat?S.firstSat:sat,prev=null,guard=0;
  for(;w<=sat&&guard<600;w=addDays(w,7),guard++){if(!S.memo[w])S.memo[w]=calcWeek(w,prev);prev=S.memo[w]}
  return S.memo[sat]||calcWeek(sat,null);
}
function weekReport(sat){
  const ms=S.movs.filter(m=>inWeek(m.fecha,sat)&&vigente(m));
  const sum=(arr)=>arr.reduce((a,m)=>a+(+m.monto||0),0);
  const ventas=ms.filter(m=>m.tipo==='venta');
  const act=t=>ms.filter(m=>m.tipo===t&&activo(m));
  const r={ventas,
    ingEf:sum(ventas.filter(m=>m.pago==='efectivo')),ingTr:sum(ventas.filter(m=>m.pago==='transferencia')),ingPend:sum(ventas.filter(m=>m.pago==='pendiente')),
    ingresos:sum(ventas),diesel:sum(act('diesel')),dieselL:act('diesel').reduce((a,m)=>a+(+m.litros||0),0),
    sueldos:sum(act('sueldo')),extras:sum(act('extra')),gastos:sum(act('gasto')),repar:sum(act('reparacion')),
    viajes:ventas.length,litrosAgua:ventas.reduce((a,m)=>a+(+m.litros||0),0),
    dias:S.jornadas.filter(j=>inWeek(j.id,sat)).length};
  r.egresos=r.diesel+r.sueldos+r.extras+r.gastos+r.repar;r.utilidad=r.ingresos-r.egresos;
  const pl={};ventas.forEach(m=>{const k=m.lugar||'—';pl[k]=pl[k]||{n:k,v:0,l:0,$:0};pl[k].v++;pl[k].l+=(+m.litros||0);pl[k].$+=(+m.monto||0)});
  r.porLugar=Object.values(pl).sort((a,b)=>b.$-a.$);
  return r;
}
function lpdEstimado(){
  let L=0,D=0,n=0;
  S.movs.filter(m=>m.tipo==='diesel'&&activo(m)&&has(m.dedosAntes)&&has(m.dedosDespues)&&+m.litros>0).forEach(m=>{const d=+m.dedosDespues-(+m.dedosAntes);if(d>0){L+=+m.litros;D+=d;n++}});
  return n>=1&&D>0?{v:L/D,n}:null;
}
function lpd(){const c=cfg('litrosPorDedo');if(has(c)&&+c>0)return{v:+c,n:0,manual:true};return lpdEstimado()}
function dedosDia(f){
  const j=S.jornadas.find(x=>x.id===f);
  const prev=S.jornadas.filter(x=>x.id<f&&has(x.dedosCierre)).sort((a,b)=>a.id<b.id?1:-1)[0];
  const cargas=S.movs.filter(m=>m.tipo==='diesel'&&activo(m)&&m.fecha===f);
  let subio=0;cargas.forEach(m=>{if(has(m.dedosAntes)&&has(m.dedosDespues))subio+=(+m.dedosDespues-(+m.dedosAntes))});
  const litros=cargas.reduce((a,m)=>a+(+m.litros||0),0);
  const ini=j&&has(j.dedosInicio)?+j.dedosInicio:null,fin=j&&has(j.dedosCierre)?+j.dedosCierre:null;
  const noche=prev&&ini!==null?(+prev.dedosCierre-ini):null;
  const consumo=ini!==null&&fin!==null?ini+subio-fin:null;
  return{f,j,prev,ini,fin,noche,subio,litros,consumo,cargas};
}
function cargaNoCuadra(m){
  const L=lpd();if(!L||(!L.manual&&L.n<3))return null;
  if(!has(m.dedosAntes)||!has(m.dedosDespues)||!(+m.litros>0))return null;
  const d=+m.dedosDespues-(+m.dedosAntes);if(d<=0)return{litros:+m.litros,real:0};
  const real=d*L.v;return(+m.litros)/real>1.35?{litros:+m.litros,real}:null;
}
function pendientes(){
  const a=[];
  S.movs.forEach(m=>{if(m.estado==='pendiente'||m.estado==='por_confirmar'||m.correccionEstado==='pendiente'||(vigente(m)&&(m.precioEstado==='por_revisar'||m.creditoEstado==='por_autorizar')))a.push(m)});
  return{movs:a,reps:S.reps.filter(r=>r.estado==='solicitada')};
}
function facturaPend(){return S.movs.filter(m=>m.tipo==='diesel'&&vigente(m)&&!m.facturado)}
function nPend(){const p=pendientes();return p.movs.length+p.reps.length}
function alertas(){
  const out=[];const t=today();const umbral=+cfg('umbralDedos')||0.5;
  for(let i=0;i<7;i++){const f=addDays(t,-i);const d=dedosDia(f);
    if(d.noche!==null&&d.noche>=umbral)out.push({lvl:'bad',t:`⛽ El tanque bajó ${num(d.noche)} dedo(s) durante la noche (${dLabel(d.prev.id)} → ${dLabel(f)}).`});
    d.cargas.forEach(m=>{const x=cargaNoCuadra(m);if(x)out.push({lvl:'bad',t:`⛽ Carga del ${dLabel(f)}: el ticket dice ${num(x.litros)} L pero el tanque subió solo ~${num(x.real)} L.`})});
  }
  const h=cfg('horaInicio');const now=new Date();const [hh,mm]=h.split(':').map(Number);
  const lim=new Date();lim.setHours(hh,mm+15,0,0);
  if(now>lim&&now.getDay()!==0&&!S.jornadas.find(j=>j.id===t))out.push({lvl:'warn',t:`⏰ El chofer aún no inicia jornada hoy (hora de entrada ${h}).`});
  S.reps.filter(r=>r.tipo==='rutinaria'&&r.estado==='programada'&&r.fechaProg&&r.fechaProg<t).forEach(r=>out.push({lvl:'warn',t:`🔧 Mantenimiento vencido: ${r.desc} (era el ${dLabel(r.fechaProg)}).`}));
  const fp=facturaPend();if(fp.length){const mes=today().slice(0,7);const viejos=fp.filter(m=>(m.fecha||'').slice(0,7)<mes).length;
    out.push({lvl:viejos?'bad':'warn',t:`🧾 Tienes ${fp.length} ticket(s) de diésel por facturar (${money(fp.reduce((a,m)=>a+(+m.monto||0),0))})${viejos?` — ${viejos} son del mes pasado, ¡factúralos ya!`:'.'} Toca aquí para verlos.`,act:'facturas'})}
  const n=nPend();if(n)out.push({lvl:'warn',t:`✅ Tienes ${n} pendiente(s) por autorizar o confirmar.`,act:'autorizar'});
  return out;
}

/* ---------- escritura ---------- */
async function save(p,ok){try{await p;if(ok)toast(ok);return true}catch(e){console.error(e);const m=String(e&&e.message||'');toast(/administrador|autoriz|confirm/i.test(m)?m:'No se pudo guardar. Revisa tu conexión e intenta de nuevo.');return false}}
const col=n=>DB.collection(n);
async function addMov(data){const ref=col('movs').doc();return save(ref.set(Object.assign({ts:Date.now(),fecha:today(),estado:'ok',por:me()},data)))}
async function updMov(id,data){return save(col('movs').doc(id).update(data))}
async function upsertLugar(nombre,ubic){
  if(!nombre)return;const id=slug(nombre);const ex=S.lugares.find(l=>l.id===id);
  if(!ex)await save(col('lugares').doc(id).set({nombre,ubic:ubic||''}));
  else if(ubic&&ubic!==ex.ubic)await save(col('lugares').doc(id).update({ubic}));
}
async function comprimir(file){
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,1024/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.6));if(b)return{blob:b,type:'image/jpeg'}}catch(e){}
  const ok=['image/jpeg','image/png','image/webp'];return ok.includes(file.type)?{blob:file,type:file.type}:null;
}
async function subirFoto(file){
  if(!file||!file.size||!S.assets)return null;
  try{const c=await comprimir(file);if(!c){toast('Formato de foto no soportado');return null}
    const path=uid()+(c.type==='image/png'?'.png':c.type==='image/webp'?'.webp':'.jpg');const{error}=await sb.storage.from('fotos').upload(path,c.blob,{contentType:c.type});if(error)throw error;return path}
  catch(e){console.error(e);toast('La foto no se pudo subir; se guardó sin foto.');return null}
}

function sheet(title,body,onSubmit,opts={}){
  const sub=onSubmit?`<button class="btn block huge" style="margin-top:18px" type="submit">${esc(opts.btn||'Guardar')}</button>`:'';
  $('#sheet').innerHTML=`<div class="ov" data-act="closeSheet"></div><form class="panel" id="sf" autocomplete="off"><div class="ph"><b>${title}</b><button type="button" class="x" data-act="closeSheet" aria-label="Cerrar">✕</button></div>${body}${sub}</form>`;
  $('#sheet').classList.add('on');
  const f=$('#sf');
  f.onsubmit=async e=>{e.preventDefault();if(!onSubmit)return;const b=f.querySelector('button[type=submit]');b.disabled=true;b.textContent='Guardando…';
    const fd={};new FormData(f).forEach((v,k)=>fd[k]=v);
    let ok=false;try{ok=await onSubmit(fd,f)}catch(err){console.error(err);toast('Ocurrió un error')}
    if(ok!==false)closeSheet();else{b.disabled=false;b.textContent=opts.btn||'Guardar'}};
  if(opts.mount)opts.mount(f);

const pagoTxt={efectivo:'Efectivo',transferencia:'Transferencia',pendiente:'Por cobrar'};
function estadoPill(m){
  let p='';
  if(m.estado==='pendiente')p+=' <span class="pill warn">Por autorizar</span>';
  if(m.estado==='por_confirmar')p+=' <span class="pill warn">Por confirmar</span>';
  if(m.estado==='rechazado')p+=' <span class="pill bad">Rechazado</span>';
  if(m.estado==='anulado')p+=' <span class="pill bad">Anulado</span>';
  if(m.tipo==='venta'&&m.pago==='pendiente')p+=m.creditoEstado==='por_autorizar'?' <span class="pill warn">Crédito por autorizar</span>':m.creditoEstado==='rechazado'?' <span class="pill bad">Crédito NO autorizado</span>':' <span class="pill warn">Por cobrar</span>';
  if(m.precioEstado==='por_revisar')p+=' <span class="pill">Precio por revisar</span>';
  if(m.precioEstado==='corregido')p+=' <span class="pill">Precio corregido</span>';
  if(m.correccionEstado==='pendiente')p+=' <span class="pill">Corrección pedida</span>';
  return p;
}
function movTitle(m){const t=T[m.tipo]||{n:m.tipo};if(m.tipo==='venta')return m.lugar||'Venta';if(m.tipo==='gasto'||m.tipo==='reparacion')return m.concepto||t.n;return t.n}
function movSub(m){
  const h=hhmm(m.ts);const p=[];
  if(m.tipo==='venta'){if(m.litros)p.push(num(m.litros)+' L');p.push(pagoTxt[m.pago]||'')}
  if(m.tipo==='diesel'){p.push(num(m.litros)+' L');if(has(m.dedosAntes))p.push(`${num(m.dedosAntes)}→${num(m.dedosDespues)} dedos`)}
  if(m.tipo==='extra'){p.push(num(m.horas)+' h');if(m.motivo)p.push(m.motivo)}
  if(m.tipo==='prestamo')p.push(m.origen==='caja'?'De la caja':'Depósito del admin');
  if(m.tipo==='reparacion')p.push(m.pagadoPor==='caja'?'Pagó la caja':'Pagó el admin');
  return esc([dLabel(m.fecha)+(h?' '+h:''),...p].filter(Boolean).join(' · '));
}
function movRow(m){
  const t=T[m.tipo]||{e:'•'};const d=cajaDelta(m);
  const cls=d>0?'pos':d<0?'neg':'mut';const sg=d>0?'+':d<0?'−':'';
  const amt=m.tipo==='extra'&&m.estado==='pendiente'&&!m.monto?'—':sg+money(m.monto).replace('-','');
  return `<div class="row tap" data-act="verMov" data-id="${esc(m.id)}"><div><div><b>${t.e} ${esc(movTitle(m))}</b>${estadoPill(m)}</div><div class="small mut">${movSub(m)}</div></div><div class="${cls} r"><b>${amt}</b>${d===0&&activo(m)&&m.tipo==='venta'?'<div class="xs mut">no entra a caja</div>':''}</div></div>`;

function mapLinks(u,l){

  else if(ll){g=`https://www.google.com/maps/search/?api=1&query=${ll[1]},${ll[2]}`;wz=`https://waze.com/ul?ll=${ll[1]},${ll[2]}&navigate=yes`}
  else{const t=encodeURIComponent(q||l||'');if(!t)return'';g=`https://www.google.com/maps/search/?api=1&query=${t}`;wz=`https://waze.com/ul?q=${t}&navigate=yes`}
  return `<a class="btn sec sm" href="${esc(g)}" target="_blank" rel="noopener">📍 Cómo llegar</a>`+(wz?`<a class="btn sec sm" href="${esc(wz)}" target="_blank" rel="noopener">Waze</a>`:'');
}

  const sub=r.estado==='hecha'?`${dLabel(r.fechaHecha||t)} · ${money(r.costo)} · ${r.pagadoPor==='caja'?'pagó la caja':'pagó el admin'}`:r.tipo==='rutinaria'?`Para el ${dLabel(r.fechaProg)}${r.intervaloDias?' · cada '+r.intervaloDias+' días':''}`:new Date(r.ts).toLocaleDateString('es-MX');
  let b='';
  if(r.estado==='autorizada'||r.estado==='programada')b+=`<button class="btn sm ok" data-act="repHecha" data-id="${esc(r.id)}">Marcar hecha</button>`;

  if(isAdmin()&&r.estado!=='hecha')b+=`<button class="btn sm sec" data-act="repDel" data-id="${esc(r.id)}">Borrar</button>`;
  return `<div class="card"><div class="row" style="padding:0"><div><b>${r.tipo==='urgente'?'🚨':'🗓️'} ${esc(r.desc)}</b><div class="small mut">${esc(sub)}</div></div>${pill}</div>${r.estado!=='hecha'&&r.foto?fotoImg(r.foto):''}${b?`<div class="btns">${b}</div>`:''}</div>`;
}

/* ---------- conexión (Supabase) ---------- */
const CFG=window.PIPAS_CONFIG||{};
let sb=null;
const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const RAW={};
const COLKEY={movs:'movs',pedidos:'pedidos',jornadas:'jornadas',reparaciones:'reps',cortes:'cortes',lugares:'lugares'};
function sync(c){if(c==='config'){S.config=(RAW.config&&RAW.config.general)||{};return}const k=COLKEY[c];if(!k)return;S[k]=Object.entries(RAW[c]||{}).map(([id,d])=>Object.assign({},d,{id}))}
function setLocal(c,id,data){RAW[c]=RAW[c]||{};if(data===null)delete RAW[c][id];else RAW[c][id]=data;sync(c)}
const DB={
  doc(path){const[c,i]=path.split('/');return DB.collection(c).doc(i)},
  collection(c){return{doc(id){id=id||uid();return{id,
    async set(d){const{error}=await sb.from('docs').upsert({col:c,id,data:d});if(error)throw error;setLocal(c,id,d);render()},
    async update(d){const{error}=await sb.rpc('doc_merge',{p_col:c,p_id:id,p_patch:d});if(error)throw error;setLocal(c,id,Object.assign({},(RAW[c]||{})[id]||{},d));render()},
    async delete(){const{error}=await sb.from('docs').delete().eq('col',c).eq('id',id);if(error)throw error;setLocal(c,id,null);render()}}}}}
};
async function loadAll(){
  const all=[];
  for(let from=0;;from+=1000){const{data,error}=await sb.from('docs').select('col,id,data').order('col').order('id').range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break}
  for(const k in RAW)delete RAW[k];
  all.forEach(r=>{RAW[r.col]=RAW[r.col]||{};RAW[r.col][r.id]=r.data||{}});
  ['config',...Object.keys(COLKEY)].forEach(sync);
}
async function loadRoles(){const{data}=await sb.from('roles').select('email,role,nombre').order('role');S.roles=data||[]}
let started=false;
async function afterLogin(session){
  S.login=false;S.email=(session.user.email||'').toLowerCase();render();
  const{data,error}=await sb.from('roles').select('role,nombre').eq('email',S.email).maybeSingle();
  if(error||!data){S.norole=true;render();return}
  S.role=data.role;S.isOwner=data.role==='admin';if(!S.isOwner)S.view='chofer';
  S.db=true;S.assets=true;
  const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
  try{await loadAll();if(S.isOwner)await loadRoles();S.err=false}catch(e){console.error(e);S.err=true}
  S.loaded=true;clearTimeout(timer);render();
  if(started)return;started=true;
  sb.channel('docs-rt').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){if(p.old&&p.old.col)setLocal(p.old.col,p.old.id,null)}
    else if(p.new&&p.new.col)setLocal(p.new.col,p.new.id,p.new.data||{});
    render()}).subscribe();
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible')return;try{await loadAll();S.err=false}catch(e){S.err=true}render()});
  setInterval(render,60000);
}
function vLogin(){return `<div style="max-width:420px;margin:24px auto"><div class="center" style="margin-bottom:14px"><img src="icon.svg" alt="" style="width:120px"></div>
  <form class="card" id="loginF"><h3 class="center">Iniciar sesión</h3>
  <label class="l">Correo</label><input name="email" type="email" autocomplete="username" required>
  <label class="l">Contraseña</label><input name="password" type="password" autocomplete="current-password" required>
  <button class="btn block huge" style="margin-top:16px" type="submit">Entrar</button></form></div>`}
document.addEventListener('submit',async e=>{
  if(!e.target||e.target.id!=='loginF')return;e.preventDefault();
  const f=e.target,b=f.querySelector('button');b.disabled=true;b.textContent='Entrando…';
  const{data,error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value});
  if(error){toast('Correo o contraseña incorrectos');b.disabled=false;b.textContent='Entrar';return}
  await afterLogin(data.session);
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;if(S.loaded)render()});
async function init(){
  render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!CFG.url||!CFG.key||!window.supabase){S.noconfig=true;render();return}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  try{const{data:{session}}=await sb.auth.getSession();if(!session){S.login=true;render();return}await afterLogin(session)}
  catch(e){console.error(e);S.login=true;render()}
}
init();
</script>
